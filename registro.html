<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>
<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Crear cuenta</legend>
                    <p>Completa la información para registrarte.</p>
                    
                    <label for="reg-nombre">Nombre completo</label>
                    <input type="text" id="reg-nombre" placeholder="Juana Pérez" required>
                    
                    <label>Género</label>
                    <div class="grupo-radios">
                        <label>Femenino</label>
                        <input type="radio" name="genero" value="femenino">
                        <label>Masculino</label>
                        <input type="radio" name="genero" value="masculino">
                        <label>Otro</label>
                        <input type="radio" name="genero" value="otro">
                    </div>
                    
                    <label for="reg-foto">Foto de perfil</label>
                    <input type="file" id="reg-foto" accept="image/*">
                    
                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
                    
                    <label for="reg-tel">Teléfono</label>
                    <input type="tel" id="reg-tel" placeholder="+1 234 567 8900">
                    
                    <label for="reg-pais">País</label>
                    <select id="reg-pais">
                        <option value="">Selecciona tu país</option>
                        <option value="ar">Argentina</option>
                        <option value="co">Colombia</option>
                        <option value="mx">México</option>
                        <option value="es">España</option>
                        <option value="otro">Otro</option>
                    </select>
                    
                    <label for="reg-pass">Contraseña</label>
                    <input type="password" id="reg-pass" placeholder="*********" required>
                    
                    <div style="margin: 10px 0;">
                        <input type="checkbox" id="terms" required>
                        <label for="terms" style="display:inline; font-weight:normal; font-size:0.85rem;">Acepto los términos y condiciones</label>
                    </div>
                    
                    <div style="margin: 10px 0;">
                        <input type="checkbox" id="news">
                        <label for="news" style="display:inline; font-weight:normal; font-size:0.85rem;">Deseo recibir noticias por correo</label>
                    </div>

                    <input type="submit" value="Registrarme">
                    <input type="reset" value="Limpiar">
                    
                    <p class="enlace">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
