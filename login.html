<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>
<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Inicio de sesión</legend>
                    <p>Ingresa tus credenciales para acceder a tu cuenta.</p>
                    
                    <label for="login-email">Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
                    
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="*********" required>
                    
                    <div style="margin: 10px 0;">
                        <input type="checkbox" id="login-remember">
                        <label for="login-remember" style="display:inline; font-weight:normal;">Recordarme</label>
                    </div>

                    <input type="submit" value="Iniciar sesión">
                    <input type="reset" value="Limpiar">
                    
                    <p class="enlace">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
